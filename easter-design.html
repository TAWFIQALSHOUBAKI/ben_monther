<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Cairo', 'Tajawal', sans-serif;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: linear-gradient(170deg, #fdf8ef 0%, #f9f1e0 30%, #faf4e8 60%, #f5ecd6 100%);
    overflow: hidden;
  }

  /* Subtle warm texture overlay */
  .canvas::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 30% 25%, rgba(196,164,78,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 75%, rgba(180,140,80,0.05) 0%, transparent 50%);
    z-index: 0;
  }

  /* Top gold arch band */
  .top-band {
    position: absolute;
    top: -30px;
    left: -50px;
    right: -50px;
    height: 230px;
    background: linear-gradient(180deg, #b8953f 0%, #c9a74d 30%, #d4b85a 60%, #dfc668 100%);
    border-radius: 0 0 50% 50%;
    z-index: 1;
  }

  .top-band-inner {
    position: absolute;
    top: -30px;
    left: -20px;
    right: -20px;
    height: 210px;
    border-radius: 0 0 50% 50%;
    border-bottom: 3px solid rgba(255,255,255,0.2);
    z-index: 2;
  }

  /* Cross at top */
  .cross-decoration {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
  }

  .cross-svg {
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
  }

  /* Main heading */
  .main-heading {
    position: absolute;
    top: 95px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    width: 90%;
  }

  .main-heading h1 {
    font-family: 'Cairo', sans-serif;
    font-size: 72px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 3px 10px rgba(0,0,0,0.15);
    line-height: 1.15;
  }

  .subtitle-line {
    font-family: 'Cairo', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    margin-top: 5px;
    letter-spacing: 6px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  /* Greeting block */
  .greeting-block {
    position: absolute;
    top: 290px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    width: 78%;
  }

  .greeting-block p {
    font-family: 'Cairo', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #5a4a2a;
    line-height: 1.8;
  }

  .highlight-red {
    color: #c0392b;
    font-weight: 800;
  }

  .highlight-gold {
    color: #b8953f;
    font-weight: 800;
  }

  /* Central product area */
  .product-center {
    position: absolute;
    top: 460px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .product-glow {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(196,164,78,0.18) 0%, rgba(196,164,78,0.06) 40%, transparent 70%);
    border-radius: 50%;
    z-index: -1;
  }

  .product-brand {
    font-family: 'Cairo', sans-serif;
    font-size: 52px;
    font-weight: 900;
    color: #1a1a2e;
    letter-spacing: 5px;
    margin-top: 15px;
  }

  .product-brand-sub {
    font-family: 'Cairo', sans-serif;
    font-size: 42px;
    font-weight: 800;
    color: #c4a44e;
    margin-top: -8px;
    letter-spacing: 2px;
  }

  .tagline {
    font-family: 'Cairo', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #8b7a55;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* Easter Eggs */
  .egg {
    position: absolute;
    z-index: 5;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.12));
  }

  .egg svg { display: block; }

  .egg-1 { top: 230px; left: 35px; transform: rotate(-15deg); }
  .egg-2 { top: 330px; right: 40px; transform: rotate(12deg); }
  .egg-3 { bottom: 260px; left: 25px; transform: rotate(18deg); }
  .egg-4 { top: 190px; right: 100px; transform: rotate(-5deg); }
  .egg-5 { bottom: 180px; right: 35px; transform: rotate(22deg); }
  .egg-6 { bottom: 340px; left: 90px; transform: rotate(-10deg); }
  .egg-7 { top: 270px; left: 140px; transform: rotate(8deg); }
  .egg-8 { bottom: 230px; right: 120px; transform: rotate(-18deg); }

  /* Flower clusters */
  .flower-svg {
    position: absolute;
    z-index: 4;
    opacity: 0.7;
  }

  .flower-1 { top: 250px; left: 160px; }
  .flower-2 { bottom: 300px; right: 145px; }
  .flower-3 { top: 380px; right: 40px; }
  .flower-4 { bottom: 180px; left: 135px; }

  /* Leaf / vine decorations */
  .vine {
    position: absolute;
    z-index: 3;
    opacity: 0.35;
  }

  .vine-left { top: 200px; left: 0; }
  .vine-right { top: 200px; right: 0; transform: scaleX(-1); }

  /* Sparkle stars */
  .sparkle {
    position: absolute;
    z-index: 6;
    color: #c4a44e;
    opacity: 0.45;
  }

  /* Decorative divider */
  .divider {
    position: absolute;
    top: 470px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    width: 300px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(196,164,78,0.5), transparent);
  }

  /* Bottom gold banner */
  .bottom-banner {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 95px;
    background: linear-gradient(0deg, #a6862f 0%, #c4a44e 100%);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bottom-banner .cta {
    font-family: 'Cairo', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    letter-spacing: 1px;
  }

  /* Ornamental corner patterns */
  .corner-ornament {
    position: absolute;
    z-index: 3;
    opacity: 0.12;
  }

  .corner-tl { top: 200px; left: 0; }
  .corner-tr { top: 200px; right: 0; transform: scaleX(-1); }
  .corner-bl { bottom: 95px; left: 0; transform: scaleY(-1); }
  .corner-br { bottom: 95px; right: 0; transform: scale(-1, -1); }

</style>
</head>
<body>
<div class="canvas">
