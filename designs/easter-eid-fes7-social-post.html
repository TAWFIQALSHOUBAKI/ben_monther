<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMETIX Focus | عيد الفصح</title>
  <style>
    :root {
      --navy: #1e2363;
      --navy-deep: #141948;
      --gold: #f3c63d;
      --gold-dark: #d8a716;
      --cream: #fbf6e9;
      --rose: #f6d9df;
      --mint: #dff0d7;
      --sky: #eef4ff;
      --red: #db2b30;
      --red-dark: #b41f25;
      --shadow: 0 24px 60px rgba(33, 26, 89, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: Arial, "Helvetica Neue", Tahoma, sans-serif;
      background: #ece7d7;
    }

    body {
      position: relative;
      color: var(--navy);
      background:
        radial-gradient(circle at 72% 25%, rgba(255, 251, 240, 0.96) 0 0, rgba(255, 251, 240, 0.88) 0 190px, rgba(255, 251, 240, 0.52) 280px, rgba(255, 251, 240, 0) 470px),
        linear-gradient(180deg, #fffaf0 0%, #faf3df 48%, #f2e5ca 100%);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.85) 0 12px, transparent 13px),
        radial-gradient(circle at 19% 18%, rgba(255, 255, 255, 0.7) 0 9px, transparent 10px),
        radial-gradient(circle at 86% 14%, rgba(255, 255, 255, 0.78) 0 10px, transparent 11px),
        radial-gradient(circle at 88% 42%, rgba(255, 255, 255, 0.55) 0 13px, transparent 14px),
        radial-gradient(circle at 13% 70%, rgba(255, 255, 255, 0.4) 0 14px, transparent 15px);
      opacity: 0.6;
      pointer-events: none;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .pattern {
      position: absolute;
      inset: 0;
      opacity: 0.18;
      background:
        radial-gradient(circle at 0 0, transparent 34px, rgba(30, 35, 99, 0.14) 35px, transparent 37px) 0 0 / 180px 180px,
        radial-gradient(circle at 90px 90px, transparent 34px, rgba(30, 35, 99, 0.12) 35px, transparent 37px) 0 0 / 180px 180px,
        linear-gradient(45deg, transparent 46%, rgba(30, 35, 99, 0.07) 47%, rgba(30, 35, 99, 0.07) 53%, transparent 54%) 0 0 / 180px 180px,
        linear-gradient(-45deg, transparent 46%, rgba(30, 35, 99, 0.07) 47%, rgba(30, 35, 99, 0.07) 53%, transparent 54%) 0 0 / 180px 180px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.22));
      z-index: -2;
    }

    .sunrise {
      position: absolute;
      right: -80px;
      top: 120px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 255, 245, 0.98) 0 24%, rgba(255, 248, 218, 0.9) 32%, rgba(255, 233, 178, 0.45) 52%, rgba(255, 235, 186, 0) 74%);
      filter: blur(10px);
      z-index: -1;
    }

    .sunrise::before,
    .sunrise::after {
      content: "";
      position: absolute;
      inset: 14% 16%;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.16);
    }

    .sunrise::after {
      inset: 3%;
      border-width: 2px;
      opacity: 0.5;
    }

    .ground {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: -120px;
      height: 350px;
      background:
        radial-gradient(circle at 50% 0, rgba(255, 252, 243, 0.7) 0 18%, rgba(255, 252, 243, 0) 55%),
        linear-gradient(180deg, rgba(214, 189, 151, 0.08) 0%, rgba(181, 150, 101, 0.28) 100%);
      border-top-left-radius: 60% 70%;
      border-top-right-radius: 60% 70%;
      z-index: -1;
    }

    .ground::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.26) 0 2px, transparent 2px 78px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.18) 0 2px, transparent 2px 68px);
      opacity: 0.22;
    }

    .logo {
      position: absolute;
      left: 66px;
      top: 56px;
      width: 300px;
      filter: drop-shadow(0 8px 18px rgba(28, 24, 74, 0.12));
    }

    .greeting {
      position: absolute;
      top: 74px;
      right: 78px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      border: 2px solid rgba(30, 35, 99, 0.12);
      box-shadow: 0 12px 30px rgba(29, 35, 99, 0.09);
      font-weight: 700;
      font-size: 28px;
      backdrop-filter: blur(10px);
    }

    .greeting::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(180deg, #f5d35f, #e9b534);
      box-shadow: 0 0 0 6px rgba(243, 198, 61, 0.18);
    }

    .copy {
      position: absolute;
      top: 230px;
      right: 78px;
      width: 560px;
      text-align: right;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.62);
      border-radius: 999px;
      font-size: 24px;
      font-weight: 700;
      color: #6a5f98;
    }

    .eyebrow .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c6a2d8;
    }

    h1 {
      margin: 0;
      font-size: 74px;
      line-height: 1.14;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--navy);
      text-shadow: 0 8px 18px rgba(255, 255, 255, 0.35);
    }

    .accent {
      color: #6d5cc1;
    }

    .subcopy {
      margin: 26px 0 0;
      font-size: 31px;
      line-height: 1.7;
      font-weight: 700;
      color: #28316c;
      max-width: 540px;
    }

    .subcopy strong {
      color: #1b2363;
    }

    .subnote {
      margin-top: 18px;
      color: rgba(30, 35, 99, 0.72);
      font-size: 24px;
      font-weight: 700;
    }

    .scene {
      position: absolute;
      left: 66px;
      bottom: 58px;
      width: 500px;
      height: 520px;
    }

    .halo {
      position: absolute;
      left: 85px;
      top: 120px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 241, 194, 0.85) 0 22%, rgba(255, 241, 194, 0.35) 48%, rgba(255, 241, 194, 0) 70%);
      filter: blur(14px);
      z-index: 0;
    }

    .burst {
      position: absolute;
      left: 250px;
      top: 170px;
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
      padding: 18px;
      background: var(--navy);
      color: #fff;
      text-align: center;
      font-weight: 800;
      font-size: 28px;
      line-height: 1.25;
      clip-path: polygon(50% 0%, 62% 10%, 76% 5%, 84% 18%, 97% 22%, 94% 36%, 100% 50%, 90% 61%, 94% 76%, 82% 82%, 78% 95%, 62% 91%, 50% 100%, 38% 91%, 22% 95%, 18% 82%, 6% 76%, 10% 61%, 0 50%, 6% 36%, 3% 22%, 16% 18%, 24% 5%, 38% 10%);
      box-shadow: 0 18px 30px rgba(22, 26, 79, 0.28);
      z-index: 4;
    }

    .burst span {
      display: block;
      font-size: 23px;
      opacity: 0.86;
      margin-top: 6px;
    }

    .sachet {
      position: absolute;
      left: 60px;
      top: 165px;
      width: 240px;
      height: 330px;
      padding: 28px 22px 22px;
      border-radius: 16px 16px 22px 22px;
      background:
        linear-gradient(135deg, #f7dd73 0%, #f3c83c 22%, #efbe26 58%, #dca40e 100%);
      box-shadow:
        inset 0 0 0 2px rgba(89, 65, 0, 0.08),
        inset 18px 0 18px rgba(255, 255, 255, 0.12),
        0 30px 40px rgba(121, 88, 15, 0.28);
      transform: rotate(-7deg);
      z-index: 3;
      overflow: hidden;
    }

    .sachet::before,
    .sachet::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      height: 12px;
      border-radius: 8px;
      background: repeating-linear-gradient(90deg, rgba(77, 53, 0, 0.18) 0 5px, rgba(255, 232, 135, 0.18) 5px 11px);
    }

    .sachet::before {
      top: 10px;
    }

    .sachet::after {
      bottom: 10px;
    }

    .sachet h2 {
      margin: 18px 0 0;
      font-size: 26px;
      letter-spacing: 1px;
      font-weight: 800;
      direction: ltr;
      color: #1e2228;
    }

    .sachet h3 {
      margin: 6px 0 10px;
      font-size: 58px;
      font-style: italic;
      line-height: 0.95;
      font-weight: 900;
      direction: ltr;
      color: #111;
    }

    .sachet .divider {
      width: 100%;
      height: 4px;
      margin: 18px 0 18px;
      background: rgba(31, 34, 42, 0.72);
    }

    .sachet p {
      margin: 0;
      font-size: 23px;
      line-height: 1.15;
      font-weight: 700;
      direction: ltr;
      color: rgba(0, 0, 0, 0.84);
    }

    .sachet .icons {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sachet .icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(31, 34, 42, 0.75);
      position: relative;
      background: rgba(255, 248, 219, 0.4);
    }

    .sachet .icon::before,
    .sachet .icon::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 3px solid rgba(31, 34, 42, 0.75);
      border-radius: 6px;
    }

    .sachet .icon:nth-child(1)::after,
    .sachet .icon:nth-child(3)::after {
      inset: auto 7px 8px 7px;
      height: 8px;
      border-radius: 999px;
    }

    .sachet .icon:nth-child(2)::before {
      inset: 8px;
      border-radius: 50%;
    }

    .sachet .weight {
      position: absolute;
      bottom: 22px;
      right: 20px;
      font-size: 25px;
      font-weight: 800;
      direction: ltr;
      color: rgba(0, 0, 0, 0.82);
    }

    .egg {
      position: absolute;
      border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
      box-shadow: 0 12px 24px rgba(73, 67, 114, 0.14);
      z-index: 1;
      overflow: hidden;
    }

    .egg::before,
    .egg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 26%, rgba(255, 255, 255, 0.56) 0 9%, transparent 10%),
        repeating-linear-gradient(165deg, transparent 0 18px, rgba(255, 255, 255, 0.55) 18px 24px, transparent 24px 36px),
        repeating-linear-gradient(12deg, transparent 0 22px, rgba(255, 255, 255, 0.4) 22px 28px, transparent 28px 44px);
      mix-blend-mode: screen;
      opacity: 0.7;
    }

    .egg::after {
      inset: 16% 12%;
      border: 3px dashed rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      background: none;
      opacity: 0.8;
    }

    .egg.one {
      left: 0;
      bottom: 14px;
      width: 118px;
      height: 148px;
      background: linear-gradient(180deg, #f6d9df 0%, #e9a3b1 100%);
      transform: rotate(-10deg);
    }

    .egg.two {
      left: 88px;
      bottom: 4px;
      width: 102px;
      height: 128px;
      background: linear-gradient(180deg, #dff0d7 0%, #b8dba7 100%);
      transform: rotate(6deg);
    }

    .egg.three {
      left: 320px;
      bottom: 16px;
      width: 94px;
      height: 118px;
      background: linear-gradient(180deg, #d7def9 0%, #b4c3ff 100%);
      transform: rotate(10deg);
    }

    .leaf {
      position: absolute;
      width: 24px;
      height: 86px;
      background: linear-gradient(180deg, #8db874, #518941);
      border-radius: 999px 999px 999px 999px / 24px 24px 62px 62px;
      transform-origin: bottom center;
      z-index: 2;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.18);
    }

    .stem {
      position: absolute;
      width: 6px;
      height: 120px;
      background: linear-gradient(180deg, #83aa64, #4f7f43);
      border-radius: 999px;
      z-index: 1;
    }

    .lily {
      position: absolute;
      width: 132px;
      height: 132px;
      z-index: 2;
    }

    .lily .petal {
      position: absolute;
      width: 56px;
      height: 96px;
      left: 38px;
      top: 18px;
      border-radius: 70% 70% 70% 70% / 100% 100% 42% 42%;
      background: linear-gradient(180deg, #fffef7 0%, #fff2cf 72%, #f0dd8d 100%);
      transform-origin: bottom center;
      box-shadow: inset 0 0 0 2px rgba(240, 221, 141, 0.72), 0 8px 20px rgba(120, 112, 61, 0.12);
    }

    .lily .petal:nth-child(1) {
      transform: rotate(-42deg);
    }

    .lily .petal:nth-child(2) {
      transform: rotate(-16deg);
    }

    .lily .petal:nth-child(3) {
      transform: rotate(12deg);
    }

    .lily .petal:nth-child(4) {
      transform: rotate(38deg);
    }

    .lily .petal:nth-child(5) {
      top: 8px;
      transform: rotate(0deg);
      height: 104px;
    }

    .lily .center {
      position: absolute;
      left: 57px;
      top: 56px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #eeb62e;
      box-shadow: 0 0 0 10px rgba(238, 182, 46, 0.16);
    }

    .lily.left {
      left: 288px;
      bottom: 38px;
      transform: scale(0.9) rotate(9deg);
    }

    .lily.right {
      left: 366px;
      bottom: 110px;
      transform: scale(0.76) rotate(-11deg);
    }

    .stem.left {
      left: 354px;
      bottom: 0;
      transform: rotate(-7deg);
    }

    .stem.right {
      left: 416px;
      bottom: 80px;
      height: 104px;
      transform: rotate(10deg);
    }

    .leaf.a {
      left: 325px;
      bottom: 48px;
      transform: rotate(-38deg);
    }

    .leaf.b {
      left: 390px;
      bottom: 72px;
      transform: rotate(22deg);
    }

    .leaf.c {
      left: 430px;
      bottom: 116px;
      transform: rotate(52deg);
      height: 70px;
    }

    .cta {
      position: absolute;
      right: 78px;
      bottom: 86px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 272px;
      height: 88px;
      padding: 0 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
      color: #fff;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.2px;
      box-shadow:
        inset 0 0 0 4px rgba(255, 255, 255, 0.72),
        0 18px 26px rgba(148, 31, 35, 0.24);
    }

    .cta::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.48);
    }

    .sparkle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #fff6d0;
      transform: rotate(45deg);
      box-shadow: 0 0 0 8px rgba(255, 246, 208, 0.14);
      opacity: 0.88;
    }

    .sparkle.s1 {
      right: 220px;
      top: 180px;
    }

    .sparkle.s2 {
      right: 120px;
      top: 422px;
      transform: rotate(45deg) scale(0.8);
    }

    .sparkle.s3 {
      left: 458px;
      bottom: 308px;
      transform: rotate(45deg) scale(0.72);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="pattern"></div>
    <div class="sunrise"></div>
    <div class="ground"></div>

    <img class="logo" src="../blured_logo.svg" alt="EMETIX logo" />

    <div class="greeting">عيد فصح مجيد</div>

    <section class="copy">
      <div class="eyebrow"><span class="dot"></span>بهجة العيد تبدأ بالتركيز</div>
      <h1>خليك حاضر<br /><span class="accent">لكل لحظة حلوة</span><br />في عيد الفصح</h1>
      <p class="subcopy">
        مع <strong>EMETIX Focus</strong> دعم للانتباه والتركيز
        خلال الزيارات، الصلاة، ولمّة العيلة.
      </p>
      <div class="subnote">تركيز وانتباه أكثر... لتعيش فرحة العيد كاملة</div>
    </section>

    <section class="scene" aria-label="Product illustration">
      <div class="halo"></div>

      <div class="egg one"></div>
      <div class="egg two"></div>
      <div class="egg three"></div>

      <div class="stem left"></div>
      <div class="stem right"></div>
      <div class="leaf a"></div>
      <div class="leaf b"></div>
      <div class="leaf c"></div>

      <div class="lily left">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
      </div>

      <div class="lily right">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
      </div>

      <div class="sachet">
        <h2>EMETIX</h2>
        <h3>Focus</h3>
        <div class="divider"></div>
        <p>For More Attention &amp;<br />Concentration</p>
        <div class="icons">
          <div class="icon"></div>
          <div class="icon"></div>
          <div class="icon"></div>
        </div>
        <div class="weight">6g</div>
      </div>

      <div class="burst">
        مفعول سريع
        <span>خلال 15 د</span>
      </div>
    </section>

    <div class="cta">اطلبه الآن</div>

    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
  </div>
</body>
</html>
