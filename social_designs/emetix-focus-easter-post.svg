<svg width="1080" height="1350" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1080" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9F2"/>
      <stop offset="1" stop-color="#F3F8FF"/>
    </linearGradient>
    <linearGradient id="sunriseGrad" x1="540" y1="720" x2="540" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9B8" stop-opacity="0"/>
      <stop offset="1" stop-color="#FDE7A0" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="packetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE63B"/>
      <stop offset="1" stop-color="#F2BF19"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B2354" flood-opacity="0.18"/>
    </filter>
    <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#141B44" flood-opacity="0.3"/>
    </filter>
    <style>
      .arabic {
        font-family: "Cairo", "Tajawal", "Noto Kufi Arabic", "Arial", sans-serif;
        direction: rtl;
        unicode-bidi: isolate;
      }
      .latin {
        font-family: "Montserrat", "Arial", sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>
  <rect y="760" width="1080" height="590" fill="url(#sunriseGrad)"/>

  <!-- Easter eggs pattern -->
  <g opacity="0.38">
    <ellipse cx="120" cy="220" rx="42" ry="54" fill="#FFDDE8"/>
    <path d="M90 220H150" stroke="#E187A6" stroke-width="6" stroke-linecap="round"/>
    <path d="M96 245C110 232 130 232 144 245" stroke="#E187A6" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="220" cy="145" rx="30" ry="38" fill="#C9EAFB"/>
    <path d="M199 145H241" stroke="#6EAED3" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="955" cy="210" rx="36" ry="46" fill="#FFE5B8"/>
    <path d="M930 210H980" stroke="#E3A24D" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="870" cy="120" rx="26" ry="34" fill="#DDF3D8"/>
    <path d="M851 120H889" stroke="#86B77A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Header block -->
  <g filter="url(#softShadow)">
    <rect x="78" y="82" width="390" height="138" rx="26" fill="#212D66"/>
    <text x="114" y="145" class="latin" font-size="56" font-weight="800" fill="#FFFFFF">EMETIX</text>
    <text x="116" y="198" class="latin" font-size="58" font-weight="700" fill="#FFE96E">Focus</text>
  </g>

  <!-- Easter label -->
  <g filter="url(#softShadow)">
    <rect x="638" y="96" width="364" height="88" rx="44" fill="#FFFFFF"/>
    <text x="962" y="152" text-anchor="end" class="arabic" font-size="46" font-weight="800" fill="#1E2B67">عيد فصح سعيد</text>
  </g>

  <!-- Main message -->
  <text x="970" y="360" text-anchor="end" class="arabic" font-size="74" font-weight="900" fill="#1A2A62">لا تخلي النعاس</text>
  <text x="970" y="442" text-anchor="end" class="arabic" font-size="74" font-weight="900" fill="#1A2A62">يأثر على يومك</text>
  <text x="970" y="518" text-anchor="end" class="arabic" font-size="48" font-weight="700" fill="#3A4A85">مع تركيز أفضل في أجواء عيد الفصح</text>

  <!-- Decorative sparkles -->
  <g fill="#FFC94F" opacity="0.9">
    <path d="M830 612L840 640L868 650L840 660L830 688L820 660L792 650L820 640Z"/>
    <path d="M915 566L921 583L938 589L921 595L915 612L909 595L892 589L909 583Z"/>
    <circle cx="760" cy="622" r="8"/>
  </g>

  <!-- Product sachet illustration -->
  <g transform="translate(108 716)" filter="url(#deepShadow)">
    <rect x="0" y="0" width="320" height="438" rx="24" fill="url(#packetGrad)"/>
    <rect x="22" y="22" width="276" height="394" rx="16" fill="#F6D52E"/>
    <text x="40" y="106" class="latin" font-size="66" font-weight="900" fill="#1A255E">EMETIX</text>
    <text x="42" y="178" class="latin" font-size="74" font-style="italic" font-weight="800" fill="#1A255E">Focus</text>
    <line x1="38" y1="206" x2="280" y2="206" stroke="#1A255E" stroke-width="5"/>
    <text x="40" y="248" class="latin" font-size="30" font-weight="700" fill="#1A255E">For Attention &amp;</text>
    <text x="40" y="284" class="latin" font-size="30" font-weight="700" fill="#1A255E">Concentration</text>
    <circle cx="74" cy="336" r="20" stroke="#1A255E" stroke-width="4" fill="none"/>
    <circle cx="158" cy="336" r="20" stroke="#1A255E" stroke-width="4" fill="none"/>
    <circle cx="242" cy="336" r="20" stroke="#1A255E" stroke-width="4" fill="none"/>
    <text x="250" y="392" class="latin" font-size="34" font-weight="800" fill="#1A255E">6g</text>
  </g>

  <!-- Badge -->
  <g transform="translate(362 760)" filter="url(#softShadow)">
    <path d="M88 8L112 28L143 22L157 50L189 60L187 92L212 112L194 138L202 170L171 182L160 212L128 210L104 232L78 212L46 218L35 188L6 174L10 142L-12 118L8 92L2 58L33 46L46 16L78 18Z" fill="#1C2A66"/>
    <path d="M88 23L109 40L136 35L148 60L176 69L174 98L196 116L180 139L187 167L161 177L151 204L124 202L103 221L81 204L53 208L44 183L19 171L22 143L2 123L20 100L15 71L42 61L53 35L80 37Z" stroke="#FFE16D" stroke-width="4" fill="none"/>
    <text x="88" y="98" text-anchor="middle" class="arabic" font-size="30" font-weight="800" fill="#FFFFFF">مفعول خلال</text>
    <text x="88" y="134" text-anchor="middle" class="arabic" font-size="30" font-weight="800" fill="#FFFFFF">15 دقيقة</text>
  </g>

  <!-- Easter grass -->
  <path d="M0 1220C60 1188 78 1182 126 1220C172 1162 188 1168 238 1220C286 1172 312 1178 350 1220C402 1168 436 1174 474 1220C520 1164 550 1170 594 1220C642 1168 668 1178 716 1220C766 1164 796 1172 844 1220C884 1170 924 1176 960 1220C998 1170 1026 1176 1080 1220V1350H0V1220Z" fill="#DAF2C8"/>

  <!-- CTA -->
  <g filter="url(#deepShadow)">
    <rect x="504" y="1152" width="516" height="124" rx="62" fill="#E3262D"/>
    <rect x="516" y="1164" width="492" height="100" rx="50" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <text x="962" y="1236" text-anchor="end" class="arabic" font-size="56" font-weight="900" fill="#FFFFFF">اطلبه الآن لعيد الفصح</text>
  </g>
</svg>
